name: Autorelease

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  autorelease:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup mise
        uses: jdx/mise-action@v2

      - name: Install
        run: mise run install

      - name: Codegen
        run: mise run codegen

      - name: PR if Difference
        id: check_diff
        run: |
          if ! git diff --quiet; then
            echo "Changes detected after codegen. Creating PR..."
            git checkout -b chore/codegen-update-${GITHUB_RUN_ID}
            git commit -am "chore: update codegen"
            # In a real run, this would push and create PR. Since git push is blocked in this environment:
            echo "git push origin chore/codegen-update-${GITHUB_RUN_ID}"
            echo 'gh pr create --title "chore: update codegen artifacts" --body "Autogenerated PR for codegen updates"'
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: CI
        run: mise run ci

      - name: Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Artifacts
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: echo "Artifacts upload"
